id = "rain"
name = "'rain"
description = "'rain: highlighting, outline, brackets, indents, text objects, runnable tests (by tree-sitter-rain), and the compiler's language server"
version = "0.1.0"
schema_version = 1
authors = ["onelivesleft"]
repository = "https://github.com/onelivesleft/tree-sitter-rain"

# The grammar: this repository, at a commit (rev). While it's a dev
# extension, the folder it's in; once pushed, its GitHub URL does as well.
[grammars.rain]
repository = "file:///C:/repos/tree-sitter-rain"
rev = "8555c3532ea185d7437bf1450a36effbfb77a026"

# The compiler's language server, rain -lsp, started by src/lib.rs.
[language_servers.rain]
name = "rain"
languages = ["Rain"]
